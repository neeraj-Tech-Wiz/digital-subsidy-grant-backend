spring.application.name=digital-subsidy-grant-platform

# Supabase PostgreSQL
spring.datasource.url=jdbc:postgresql://aws-0-ap-southeast-2.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.mndsxvxeyqesrzuqobhr
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Server
server.port=${PORT:8080}

# JWT Authentication
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Rejection cooldown
rejection.cooldown.days=${REJECTION_COOLDOWN_DAYS:40}

# Brevo Transactional Email HTTP API
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=${BREVO_SENDER_NAME:Digital Subsidy & Grant Platform}

# Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0