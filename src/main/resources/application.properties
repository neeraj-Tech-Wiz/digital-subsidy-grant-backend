spring.application.name=digital-subsidy-grant-platform

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

jwt.secret=${JWT_SECRET:YOUR_BASE64_ENCODED_SECRET_HERE}
jwt.expiration=86400000
spring.profiles.active=local

rejection.cooldown.days=${REJECTION_COOLDOWN_DAYS:40}

# Spring Mail Properties for Brevo SMTP
spring.mail.host=${BREVO_SMTP_HOST:}
spring.mail.port=${BREVO_SMTP_PORT:587}
spring.mail.username=${BREVO_SMTP_USERNAME:}
spring.mail.password=${BREVO_SMTP_KEY:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
brevo.sender.email=${BREVO_SENDER_EMAIL:noreply@digitalsubsidy.gov}
brevo.sender.name=${BREVO_SENDER_NAME:Digital Subsidy Platform}

# Flyway Configuration - baseline for existing DB
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
